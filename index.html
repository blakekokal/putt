<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#121213">
<title>Wordle</title>
<style>
  :root {
    --bg: #121213; --text: #fff; --border: #3a3a3c; --border-filled: #565758;
    --key: #818384; --green: #538d4e; --yellow: #b59f3b; --gray: #3a3a3c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; height: 52px; border-bottom: 1px solid var(--border); flex: none; }
  header h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 1px; }
  #new, #hint { width: 90px; background: none; color: var(--text); border: 1px solid var(--border-filled);
    border-radius: 4px; padding: 6px 4px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  #hint:disabled { cursor: default; color: var(--yellow); border-color: var(--yellow); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  #board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px;
    height: min(420px, 100%); aspect-ratio: 5 / 6; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .tile { border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: clamp(20px, 7vmin, 32px); font-weight: 700; text-transform: uppercase; user-select: none; }
  .tile.filled { border-color: var(--border-filled); animation: pop .1s; }
  .tile.correct, .tile.present, .tile.absent { border-color: transparent; }
  .tile.correct { background: var(--green); }
  .tile.present { background: var(--yellow); }
  .tile.absent  { background: var(--gray); }
  .tile.flip { animation: flip .5s ease forwards; }
  .row.shake { animation: shake .5s; }
  .tile.bounce { animation: bounce .4s; }
  @keyframes pop { 50% { transform: scale(1.1); } }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(-90deg); } 100% { transform: rotateX(0); } }
  @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  @keyframes bounce { 40% { transform: translateY(-25px); } 60% { transform: translateY(4px); } }
  #keyboard { flex: none; padding: 0 8px 10px; max-width: 500px; width: 100%; margin: 0 auto; user-select: none; }
  .krow { display: flex; gap: 6px; margin-bottom: 8px; }
  .krow .half { flex: .5; }
  .key { flex: 1; height: 58px; border: 0; border-radius: 4px; background: var(--key); color: var(--text);
    font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  .key.wide { flex: 1.5; font-size: 12px; }
  .key.correct { background: var(--green); }
  .key.present { background: var(--yellow); }
  .key.absent  { background: var(--gray); }
  #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); display: flex;
    flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 10; }
  .msg { background: #fff; color: #000; font-weight: 700; padding: 12px 16px; border-radius: 4px;
    font-size: 14px; transition: opacity .3s; }
  #again { position: fixed; left: 50%; bottom: 50%; transform: translate(-50%, 50%); display: none;
    background: var(--green); color: #fff; border: 0; border-radius: 24px; padding: 14px 28px;
    font-size: 18px; font-weight: 700; cursor: pointer; z-index: 11; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
  #again.show { display: block; }
</style>
</head>
<body>
<header>
  <button id="hint">HINT</button>
  <h1>Wordle</h1>
  <button id="new">NEW GAME</button>
</header>
<main><div id="board"></div></main>
<div id="keyboard"></div>
<div id="toast"></div>
<button id="again">Play Again</button>

const split = s => s.match(/.{5}/g);
const ANSWERS = split(ANSWERS_RAW);
const VALID = new Set(ANSWERS.concat(split(EXTRA_RAW)));

const ROWS = 6, COLS = 5, FLIP_MS = 300;
const boardEl = document.getElementById('board');
const kbEl = document.getElementById('keyboard');
const toastEl = document.getElementById('toast');
const againBtn = document.getElementById('again');
const keyEls = {};
let answer, row, col, guesses, over, busy;

// Build keyboard
[["q","w","e","r","t","y","u","i","o","p"],
 ["_","a","s","d","f","g","h","j","k","l","_"],
 ["enter","z","x","c","v","b","n","m","back"]].forEach(keys => {
  const r = document.createElement('div'); r.className = 'krow';
  keys.forEach(k => {
    if (k === '_') { const s = document.createElement('div'); s.className = 'half'; r.appendChild(s); return; }
    const b = document.createElement('button'); b.className = 'key';
    if (k === 'enter' || k === 'back') b.classList.add('wide');
    b.textContent = k === 'back' ? '⌫' : k;
    b.dataset.key = k;
    b.addEventListener('click', e => { e.currentTarget.blur(); press(k); });
    keyEls[k] = b; r.appendChild(b);
  });
  kbEl.appendChild(r);
});

function newGame() {
  answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
  row = 0; col = 0; over = false; busy = false;
  guesses = Array.from({ length: ROWS }, () => Array(COLS).fill(''));
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const rEl = document.createElement('div'); rEl.className = 'row';
    for (let c = 0; c < COLS; c++) { const t = document.createElement('div'); t.className = 'tile'; rEl.appendChild(t); }
    boardEl.appendChild(rEl);
  }
  Object.values(keyEls).forEach(k => k.classList.remove('correct', 'present', 'absent'));
  toastEl.innerHTML = '';
  againBtn.classList.remove('show');
  hintBtn.disabled = false; hintBtn.textContent = 'HINT';
}

const tile = (r, c) => boardEl.children[r].children[c];

function toast(text, ms = 1200) {
  const m = document.createElement('div'); m.className = 'msg'; m.textContent = text;
  toastEl.prepend(m);
  if (ms) setTimeout(() => { m.style.opacity = 0; setTimeout(() => m.remove(), 300); }, ms);
}

function press(k) {
  if (over || busy) return;
  if (k === 'enter') return submit();
  if (k === 'back') {
    if (col > 0) { col--; guesses[row][col] = ''; const t = tile(row, col); t.textContent = ''; t.classList.remove('filled'); }
    return;
  }
  if (/^[a-z]$/.test(k) && col < COLS) {
    guesses[row][col] = k; const t = tile(row, col); t.textContent = k; t.classList.add('filled'); col++;
  }
}

function score(guess, target) {
  const res = Array(COLS).fill('absent'), counts = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === target[i]) res[i] = 'correct';
    else counts[target[i]] = (counts[target[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (res[i] !== 'correct' && counts[guess[i]] > 0) { res[i] = 'present'; counts[guess[i]]--; }
  }
  return res;
}

const RANK = { absent: 1, present: 2, correct: 3 };

function shakeRow() {
  const rEl = boardEl.children[row];
  rEl.classList.remove('shake'); void rEl.offsetWidth; rEl.classList.add('shake');
}

function submit() {
  const guess = guesses[row].join('');
  if (guess.length < COLS) { toast('Not enough letters'); shakeRow(); return; }
  if (!VALID.has(guess)) { toast('Not in word list'); shakeRow(); return; }
  busy = true;
  const res = score(guess, answer), r = row;
  res.forEach((state, i) => {
    const t = tile(r, i);
    setTimeout(() => {
      t.classList.add('flip');
      setTimeout(() => t.classList.add(state), 250);
    }, i * FLIP_MS);
  });
  setTimeout(() => {
    res.forEach((state, i) => {
      const k = keyEls[guess[i]], cur = ['correct', 'present', 'absent'].find(c => k.classList.contains(c));
      if (!cur || RANK[state] > RANK[cur]) { k.classList.remove('correct', 'present', 'absent'); k.classList.add(state); }
    });
    busy = false;
    if (guess === answer) {
      over = true;
      toast(['Genius', 'Magnificent', 'Impressive', 'Splendid', 'Great', 'Phew'][r], 2000);
      for (let i = 0; i < COLS; i++) setTimeout(() => tile(r, i).classList.add('bounce'), i * 100);
      setTimeout(() => againBtn.classList.add('show'), 1200);
    } else if (r === ROWS - 1) {
      over = true;
      toast(answer.toUpperCase(), 0);
      setTimeout(() => againBtn.classList.add('show'), 800);
    } else { row++; col = 0; }
  }, (COLS - 1) * FLIP_MS + 550);
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); if (over) { newGame(); return; } press('enter'); }
  else if (e.key === 'Backspace') press('back');
  else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toLowerCase());
});
const hintBtn = document.getElementById('hint');
function giveHint() {
  if (over || busy || hintBtn.disabled) return;
  // Positions not yet solved (green) in any submitted guess
  const solved = new Set();
  for (let r = 0; r < row; r++) for (let i = 0; i < COLS; i++) if (guesses[r][i] === answer[i]) solved.add(i);
  const open = [...Array(COLS).keys()].filter(i => !solved.has(i));
  if (!open.length) return;
  // Prefer letters you haven't discovered at all (not green/yellow on the keyboard)
  const known = l => keyEls[l].classList.contains('correct') || keyEls[l].classList.contains('present');
  const fresh = open.filter(i => !known(answer[i]));
  const pool = fresh.length ? fresh : open;
  const i = pool[Math.floor(Math.random() * pool.length)], L = answer[i].toUpperCase();
  hintBtn.disabled = true; hintBtn.textContent = '#' + (i + 1) + ' = ' + L;
  toast('Letter ' + (i + 1) + ' is ' + L, 2500);
}
hintBtn.addEventListener('click', e => { e.currentTarget.blur(); giveHint(); });
document.getElementById('new').addEventListener('click', e => { e.currentTarget.blur(); newGame(); });
againBtn.addEventListener('click', newGame);

newGame();
</script>
